spring.application.name=mall-admin
spring.profiles.active=local
server.port=8080

# ============================================================
# JWT 配置
# ============================================================

# 签名密钥。
# 要求：HS256 算法要求密钥至少 256 位，也就是 32 个字节。
#       下面这串是 64 个 ASCII 字符 = 64 字节，够用。
#
# ⚠️ 真实项目里这个值绝对不能提交到 Git。
#    现在是为了学习方便才写在这里，上线前应改为：
#      - 环境变量：${JWT_SECRET}
#      - 或配置中心
jwt.secret=mall-admin-jwt-secret-key-please-change-in-production-0123456789

# token 有效期（毫秒）。
# 2 小时 = 2 × 60 × 60 × 1000 = 7,200,000
#
# 为什么是 2 小时而不是 7 天？
#   JWT 发出去就收不回来，没有「强制下线」的能力。
#   有效期越长，token 泄露后被人利用的窗口就越长。
#   2 小时是业务系统和安全性的常见折中。
jwt.expiration=7200000

# ============================================================
# 文件上传
# ============================================================
# 单文件最大 5MB。
# 超了会在 multipart 解析阶段就被拒掉，请求根本进不到 Controller。
spring.servlet.multipart.max-file-size=5MB
# 整个请求最大 10MB。
# 比 max-file-size 大，是为了给「一次传多个文件」或表单其它字段留余量。
spring.servlet.multipart.max-request-size=10MB

# 图片存储根目录（相对项目根目录）。
# 相对路径由 FileService 按「进程工作目录」解析成绝对路径，
# 所以 mvn spring-boot:run / mvn test 时都落在项目根下。
# 生产环境应改成绝对路径（如 /data/mall/uploads），避免依赖启动目录。
mall.upload.dir=uploads
