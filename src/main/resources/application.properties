spring.application.name=mall-admin
spring.profiles.active=local
server.port=8080

# ============================================================
# JWT 配置
# ============================================================

# 签名密钥。
# 要求：HS256 算法要求密钥至少 256 位，也就是 32 个字节。
#       下面这串是 64 个 ASCII 字符 = 64 字节，够用。
#
# ⚠️ 真实项目里这个值绝对不能提交到 Git。
#    现在是为了学习方便才写在这里，上线前应改为：
#      - 环境变量：${JWT_SECRET}
#      - 或配置中心
jwt.secret=mall-admin-jwt-secret-key-please-change-in-production-0123456789

# token 有效期（毫秒）。
# 2 小时 = 2 × 60 × 60 × 1000 = 7,200,000
#
# 为什么是 2 小时而不是 7 天？
#   JWT 发出去就收不回来，没有「强制下线」的能力。
#   有效期越长，token 泄露后被人利用的窗口就越长。
#   2 小时是业务系统和安全性的常见折中。
jwt.expiration=7200000
